name: Auto publish MERIDIAN APPROACH update

# 포병(FIRE DIRECTION LAB)과 같은 방식:
#  - 저장소 최상위에 MERIDIAN_APPROACH_v<판>.html 을 올린다  예) MERIDIAN_APPROACH_v0.29.85.html
#  - <title> 의 vX.Y.Z 가 파일 이름 판과 같아야 한다
#  - 가장 높은 판으로 update.json 을 갱신한다 (깔린 앱이 이 파일을 보고 새 판을 받는다)
#  - 판 HTML 은 최근 10개만 남긴다
#  - 내용이 바뀌면 판 번호를 올린다 (같은 번호면 기기에 업데이트가 안 뜬다)

on: [push, workflow_dispatch]

permissions:
  contents: write

concurrency:
  group: meridian-approach-update
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh update.json / keep latest 10
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          rx = re.compile(r"^MERIDIAN_APPROACH_v(\d+)\.(\d+)\.(\d+)(?:_[^/]*)?\.html$", re.I)
          title_rx = re.compile(r"<title>[^<]*?v(\d+)\.(\d+)\.(\d+)", re.I)

          found = []
          for p in Path(".").glob("MERIDIAN_APPROACH_v*.html"):
              m = rx.match(p.name)
              if m:
                  found.append((tuple(map(int, m.groups())), p.name, p))

          if not found:
              print("판 HTML(MERIDIAN_APPROACH_v*.html)이 최상위에 없어 아무것도 건드리지 않습니다.")
              raise SystemExit(0)

          found.sort(key=lambda x: (x[0], x[1]))
          (major, minor, patch), _, game = found[-1]
          if minor > 999 or patch > 999:
              raise SystemExit("판 번호 칸이 999를 넘습니다 — build 규칙이 깨집니다.")
          version = f"{major}.{minor}.{patch}"

          head = game.read_bytes()[:8192].decode("utf-8", "ignore")
          t = title_rx.search(head)
          if not t or tuple(map(int, t.groups())) != (major, minor, patch):
              raise SystemExit(f"{game.name}: <title> 판이 파일 이름 판(v{version})과 다릅니다.")

          for _, _, old in found[:-10]:
              print(f"remove {old.name}")
              old.unlink()

          build = major * 1_000_000 + minor * 1_000 + patch   # 앱도 <title> 에서 같은 식으로 셈한다
          data = {
              "version": version,
              "build": build,
              "file": game.name,
              "sha256": hashlib.sha256(game.read_bytes()).hexdigest(),
              "notes": f"MERIDIAN APPROACH v{version}",
              "mandatory": False,
          }
          Path("update.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"version = {version} · build = {build} · file = {game.name}")
          PY

      - name: Commit if changed
        shell: bash
        run: |
          git add -A -- update.json 'MERIDIAN_APPROACH_v*.html'
          if git diff --cached --quiet; then
            echo "already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish latest MERIDIAN APPROACH update"
          git push
