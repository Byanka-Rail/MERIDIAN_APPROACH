name: Build MERIDIAN APPROACH APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu 러너에는 Android SDK 가 이미 있다 (setup-android 액션이 깨져서 바꿈).
      - name: Install Android 35 SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || { echo "sdkmanager not found at $SDKM"; ls -la "$ANDROID_HOME" || true; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MERIDIAN_APPROACH_APP2_DEBUG.apk
          sha256sum dist/MERIDIAN_APPROACH_APP2_DEBUG.apk > dist/MERIDIAN_APPROACH_APP2_DEBUG.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MERIDIAN_APPROACH_APP2_ANDROID
          path: dist/*
          if-no-files-found: error
